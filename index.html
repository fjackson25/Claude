<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    :root {
      --bg: #f7f5f2;
      --text: #1f1f1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --text: #f2f2f2;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: clamp(3rem, 12vw, 8rem);
      font-weight: 700;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>Hello</h1>
</body>
</html>
